name: AI Team Orchestrator

# 指定されたIssue番号1件について、coder → qa-engineer → reviewer のループで実装し、PRを作成する。
# PRのマージは絶対に行わない（人間が実施）。
#
# 対象Issueの選定自体は ai-team-scheduler.yml が1日1回、LLMを使わない決定的なロジックで行い、
# 選定結果をこのworkflow_dispatchの issue_number 入力として渡す(直接この workflow を選定目的で
# 手動実行する場合は、対応したいIssue番号を明示的に指定すること)。
# こうしてトリガー発火時点でIssue番号が確定しているため、run-name にIssue番号を出せる。
#
# NOTE: anthropics/claude-code-action の入力仕様(claude_code_oauth_token など)は
# バージョンによって変わることがあるため、実際に動かす前に以下で最新の入力仕様を確認すること。
# https://github.com/anthropics/claude-code-action
#
# NOTE: 手動実行(workflow_dispatch)でissue_numberに誤って`#3`のように`#`付きで
# 入力されると、プロンプト内で`gh issue comment #3 ...`のようなbashコマンドに
# 埋め込まれた際に`#`以降がシェルのコメント扱いとなり引数が消え、実装が完了しない
# まま黙って終了する障害が過去に発生した。「Sanitize issue number input」ステップで
# 数字以外の文字を取り除いてから prompt 内で使うことで、この種の入力ミスに対して
# 防御的になっている。
#
# NOTE: ai-team-scheduler.yml は既定のGITHUB_TOKEN(actor: github-actions[bot])で
# `gh workflow run ai-team.yml` を叩いてこのワークフローを起動するため、
# allowed_bots に github-actions を含めておかないと
# claude-code-action が「非人間アクターからの起動」として拒否し、
# スケジューラー経由の自動起動が毎回失敗する(実際に発生した障害)。
#
# NOTE: PMがサブエージェント(coder/qa-engineer/reviewer)をTask toolでバックグラウンド
# 起動したまま「完了通知を待つ」形でターンを終えると、このワークフローは1回きりの
# 非対話実行のため通知を受け取れる次のターンが来ず、Statusが In Progress のまま
# 何も完了しないままジョブだけ正常終了してしまう障害が実際に発生した。
# prompt内で毎回サブエージェントを同期実行(run_in_background: false)するよう
# 明示的に指示している。

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "実装対象のIssue番号(数字のみ。#は付けないこと。例: 3)"
        required: true
        type: number

run-name: "AI Team Orchestrator: Issue #${{ inputs.issue_number }}"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ai-team-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  pm-orchestrate:
    runs-on: ubuntu-latest
    env:
      # 注意: claude-code-action は内部で GH_TOKEN/GITHUB_TOKEN を
      # 自身のGitHub Appインストールトークン(claude[bot])で上書きするため、
      # ここに直接 GH_TOKEN を設定しても Bash ツール内では効かない。
      # 別名で持たせ、gh project 系コマンドを叩くときだけ明示的に
      # `GH_TOKEN=$PROJECTS_GH_TOKEN gh project ...` のように前置して使う。
      PROJECTS_GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
      STATUS_TODO_ID: ${{ vars.STATUS_TODO_ID }}
      STATUS_IN_PROGRESS_ID: ${{ vars.STATUS_IN_PROGRESS_ID }}
      STATUS_UNDER_REVIEW_ID: ${{ vars.STATUS_UNDER_REVIEW_ID }}
      STATUS_DONE_ID: ${{ vars.STATUS_DONE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize issue number input
        id: sanitize
        run: |
          raw="${{ inputs.issue_number }}"
          clean="$(echo "$raw" | tr -dc '0-9')"
          if [ -z "$clean" ]; then
            echo "::error::issue_number must contain a number, got: '$raw'"
            exit 1
          fi
          if [ "$raw" != "$clean" ]; then
            echo "::warning::issue_number '$raw' contained non-digit characters (e.g. a leading '#'); sanitized to '$clean'"
          fi
          echo "issue_number=$clean" >> "$GITHUB_OUTPUT"

      - name: Run PM (lead) agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude,github-actions"
          prompt: |
            あなたはこのチームのPM/リードエンジニアです。今回対応するIssueは #${{ steps.sanitize.outputs.issue_number }} です。
            (Issueの選定自体は ai-team-scheduler.yml が既に済ませているので、選び直す必要はありません)
            以下の手順で実行してください。

            重要: `gh project` で始まるコマンド(item-list, item-add, item-edit など)は
            必ず先頭に `GH_TOKEN=$PROJECTS_GH_TOKEN` を付けて実行すること。
            (通常のGH_TOKENはこのセッション用のbotトークンで、Organization配下の
            Projectを読み書きする権限がないため、専用のPROJECTS_GH_TOKENに
            明示的に差し替える必要がある。issue/PR操作は素の `gh` のままでよい)

            Status更新は毎回このコマンドの `--single-select-option-id` だけを差し替えて実行する:
            `GH_TOKEN=$PROJECTS_GH_TOKEN gh project item-edit --project-id $PROJECT_ID --field-id $STATUS_FIELD_ID --id <ITEM_ID> --single-select-option-id <option-id>`

            ## 実装

            **重要な運用ルール(必須・手順2〜11全体に適用する安全装置)**: 手順2でStatusを In Progress にした後、
            何らかの理由(サブエージェント呼び出しの失敗、予期しないエラー、無料枠制約で実装不可能と判明した場合など)で
            このセッションが手順7のPR作成を完了しないまま終了することになった場合は、終了する前に必ず次の両方を行うこと:
              a. Statusを Todo ($STATUS_TODO_ID) に戻す。
              b. 対象Issueに、自動実装が完了せず中断したためTodoに差し戻した旨と、わかる範囲での理由を日本語で1件コメントする
                 (`gh issue comment #${{ steps.sanitize.outputs.issue_number }} --body "..."`)。
            このルールを怠ると、Statusが In Progress のまま放置され、ai-team-scheduler.ymlが以降の実行で
            このIssueを「他の実行が対応中」と誤認して永久にスキップし続けてしまう(過去に実際に発生した障害)。

            1. `GH_TOKEN=$PROJECTS_GH_TOKEN gh project item-list $PROJECT_NUMBER --owner $PROJECT_OWNER --format json` でIssue #${{ steps.sanitize.outputs.issue_number }} のProjectアイテムID(ITEM_ID)を探す(見つからない場合は `GH_TOKEN=$PROJECTS_GH_TOKEN gh project item-add $PROJECT_NUMBER --owner $PROJECT_OWNER --url <issue-url>` で追加する)。
            2. Statusを In Progress ($STATUS_IN_PROGRESS_ID) に更新する。
            3. **重要な制約(必須)**: 実装・インフラ選定は必ず無料で完結する方法のみを採用すること。課金が発生する可能性のある操作は絶対に実行しない。この制約によって実装できない場合は、実装を行わず、上記の運用ルールに従ってStatusをTodoに戻し、Issueにコメントを残した上で終了する。
            4. `coder` サブエージェントに、Issue #${{ steps.sanitize.outputs.issue_number }} の番号と内容を伝えて実装とブランチ作成を依頼する。
            5. `qa-engineer` サブエージェントにテスト作成・実行を依頼する。
            6. テストが失敗した場合は `coder` に修正を依頼し、5に戻る(通るまで繰り返す。この間Statusは In Progress のまま)。
            7. テストが通ったら、ブランチを `git push -u origin <branch>` でリモートに反映し、`Closes #${{ steps.sanitize.outputs.issue_number }}` を含めてPRを作成する(`gh pr create --title ... --body ...`)。作成後 `gh pr view --json number --jq '.number'` でPR番号を控える(以降reviewer/coderに伝える)。

            ## セルフレビュー(reviewer)

            8. `reviewer` サブエージェントに、控えたPR番号を伝えてレビューを依頼する。reviewerは `gh pr review` で実際にGitHub上へapprove/request changesを投稿する(PMへのテキスト報告だけで終わらせない)。
            9. reviewerがrequest changesを出した場合は、`coder` にPR番号を伝えて修正を依頼する。coderは `gh pr view <PR番号> --json reviews,comments` 等で実際のレビュー内容を確認した上で同じブランチ上で修正し、`git push` で反映する。反映後、再度 `reviewer` に同じPR番号でレビューを依頼する(このループの間、Statusはまだ更新しない)。
            10. reviewerがapproveを出した場合、PR本文に「## 動作確認(エビデンス)」セクションを追記し、qa-engineerが報告した実際のテスト出力をそのまま貼る。pytest実行・評価スクリプト実行など実行コマンドがあるものは、実行した具体的なコマンドも合わせて明記する。実機(ブラウザ等)の操作による動作確認を行った場合は、その検証フロー(操作手順)を箇条書きで記載した上で結果を示す。
            11. **PRのマージは絶対に行わない(マージは必ず人間が行う)。** PR作成が完了したら、それ以上待機せず終了する。PR本文には以下を含める:
                - `Closes #${{ steps.sanitize.outputs.issue_number }}`
                - ## 対応したIssue(番号とリンク)
                - ## 変更内容
                - ## 動作確認(エビデンス)
                - ## セルフレビューでの気付き(reviewerが実際に投稿したPRレビューを参照する旨と、その中のスコープ外の発見事項を起票したIssue番号があれば記載。問題が無ければ「特になし」)
            12. ターン数の都合などでapproveに到達できずに終了する場合は、PRにこれまでの経緯を要約したコメントを残す。

            ## スコープ外の発見事項の扱い

            13. coder / qa-engineer の報告、および `gh pr view <PR番号> --json reviews --jq '.reviews[].body'` で確認できるreviewerの実際のレビュー本文中の「## スコープ外の発見事項」に、範囲外の問題が含まれていた場合、それぞれについて以下を行う(なければ何もしなくてよい):
                a. `gh issue list --state open` で確認し、既存Issueと内容が重複する場合は新規作成しない。
                b. 重複がなければ `gh issue create --title "<簡潔なタイトル>" --body "<概要・背景・やること・発見の経緯(Issue #${{ steps.sanitize.outputs.issue_number }}の実装中に発見、という旨)>"` で起票する。
                c. `gh issue edit <新Issue番号> --add-label found-in-review` でラベルを付与する。優先度は `next` を基本とする(緊急性が本当に高い場合のみ `now`)。
                d. `GH_TOKEN=$PROJECTS_GH_TOKEN gh project item-add $PROJECT_NUMBER --owner $PROJECT_OWNER --url <新IssueのURL>` でProjectに追加する(Statusは既定のTodoのままでよい)。
                e. 起票したIssueの番号を、今回のPR本文の「セルフレビューでの気付き」に記載する。

            14. 最後に、対応したIssue番号、作成したPRのURL、reviewerのレビュー結果(approve/request changesの経緯と回数)、新規に起票したIssue(あれば)を日本語でレポートする。

            各サブエージェントは Task tool 経由で呼び出してください。**必ず同期実行(run_in_background: false)で呼び出し、
            サブエージェントの完了(実際の出力)を受け取ってから次の手順に進むこと。** このワークフローはGitHub Actions上で
            1回きり実行される非対話セッションであり、「バックグラウンドで実行して完了通知を待つ」動作は成立しない
            (完了通知を受け取れる「次のターン」が来る前にジョブ自体が終了し、Statusが In Progress のまま何も完了しない
            まま放置される障害が実際に発生した)。サブエージェントをバックグラウンドで起動したまま自分のターンを
            終えることは絶対にしないこと。

            ## 制約
            - **PRのレビュー状況・CI結果・マージ状況を監視したり、それらを待つために処理を停止(sleep等)したりすることは絶対にしない。** PRを作成したら、その後どうなるか(人間にレビューされるか、マージされるか)を確認・待機せずに終了すること。
            - 既存のオープンなPRにレビューコメント(人間からのもの)が付いていても、このワークフローの通常フローではそれに対応しない。レビューコメントへの対応は、ユーザーが明示的に指示した時にだけ行う。
            - 1回の実行で対応するIssueは1件のみ。
            - mainブランチへの直接コミット・pushは禁止。
            - .envの値やAPIキーなど秘密情報をコードやPR本文に含めない。
            - 課金が発生する可能性のある操作は絶対に実行しない。
            - 担当範囲はあくまで「指定された1件のIssueの実装」+「その過程で偶然見つけたスコープ外の問題のIssue化」まで。リポジトリ全体を能動的にスキャンして新たな問題点を探すことはしない(それは daily-health-check.yml の担当範囲)。
            - reviewer の LGTM なしでのマージは、テストが全て通っていたとしても禁止。**LGTMが出ても人間承認なしの自動マージは絶対に行わない。**
          claude_args: |
            --max-turns 60 --allowedTools "Bash,Read,Write,Edit,Grep,Glob,Task"
